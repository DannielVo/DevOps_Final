name: CD Pipeline (Deploy to Swarm - SHA version)

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  deploy:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set TAG from CI
        run: echo "TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Pull image by SHA
        run: docker pull $IMAGE_NAME:$TAG

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-stack.yml to server
        run: |
          scp -i ~/.ssh/id_rsa docker/docker-stack.yml \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/docker-stack.yml

      - name: Deploy to Docker Swarm
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            export IMAGE_NAME=${IMAGE_NAME}
            export TAG=${TAG}

            docker pull ${IMAGE_NAME}:${TAG}
            docker stack deploy -c docker-stack.yml myapp --with-registry-auth
          EOF
